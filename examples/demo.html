<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Rediads Renderer Integration Example</title>

    <!-- Local Prebid build (includes pubmatic adapter) -->
    <script async src="/prebid.js"></script>
    <script async src="/rediads-renderer.umd.cjs?v=1.0.6"></script>
  </head>
  <body>
    <h1>Rediads Renderer Integration Example</h1>

    <div id="ad-unit-1"></div>

    <script>
      var pbjs = window.rediads_pbjs || window.pbjs || {};
      pbjs.que = pbjs.que || [];

      var SLOT_WIDTH = 300;
      var SLOT_HEIGHT = 250;

      // Prebid debugging default sample VAST (known-good with IMA)
      var SAMPLE_VAST_XML =
        '<?xml version="1.0" encoding="UTF-8"?>' +
        '<VAST version="3.0"><Ad><InLine>' +
        '<AdSystem>GDFP</AdSystem>' +
        '<AdTitle>Demo</AdTitle>' +
        '<Description><![CDATA[Demo]]></Description>' +
        '<Creatives><Creative><Linear>' +
        '<Duration>00:00:11</Duration>' +
        '<VideoClicks><ClickThrough><![CDATA[https://prebid.org/]]></ClickThrough></VideoClicks>' +
        '<MediaFiles>' +
        '<MediaFile delivery="progressive" width="' +
        SLOT_WIDTH +
        '" height="' +
        SLOT_HEIGHT +
        '" type="video/mp4" scalable="true" maintainAspectRatio="true">' +
        '<![CDATA[https://s3.amazonaws.com/files.prebid.org/creatives/PrebidLogo.mp4]]>' +
        '</MediaFile></MediaFiles></Linear></Creative></Creatives>' +
        '</InLine></Ad></VAST>';

      var rendererConfig = {
        adText: 'Advertisement',
        autoplay: true,
        muted: true,
        showControls: true,
        showCloseButton: true,
        onEvent: function (event) {
          console.log('[Rediads]', event.type, event);
        },
      };

      function ensureVastBid(bid) {
        var next = Object.assign({}, bid);
        if (!next.vastUrl && !next.vastXml) {
          if (next.ad && String(next.ad).indexOf('<VAST') === 0) {
            next.vastXml = next.ad;
          } else {
            next.vastXml = SAMPLE_VAST_XML;
          }
        }
        return next;
      }

      var adUnit = {
        code: 'ad-unit-1',
        mediaTypes: {
          video: {
            context: 'outstream',
            playerSize: [SLOT_WIDTH, SLOT_HEIGHT],
            mimes: ['video/mp4', 'video/webm', 'video/ogg'],
            protocols: [2, 3, 5, 6, 7, 8],
            api: [2],
          },
        },
        bids: [
          {
            bidder: 'pubmatic',
            params: {
              publisherId: '162837',
            },
          },
          {
            bidder: 'michao',
            params: {
              placement: 'inbanner',
              site: 1,
              test: true,
            },
          },
        ],
        renderer: {
          url: '/rediads-renderer.umd.cjs?v=1.0.6',
          requiresVastUrl: false,
          render: function (bid) {
            if (!window.rediads) {
              console.error('[Rediads] Renderer not loaded yet');
              return;
            }
            var vastBid = ensureVastBid(bid);
            console.log('[demo] render bid', {
              mediaType: vastBid.mediaType,
              hasVastUrl: !!vastBid.vastUrl,
              hasVastXml: !!vastBid.vastXml,
            });
            window.rediads.renderOutstream(
              vastBid,
              document.getElementById('ad-unit-1'),
              rendererConfig
            );
          },
        },
      };

      pbjs.que.push(function () {
        pbjs.setConfig({
          cache: {
            useLocal: true,
            allowVastXmlOnly: true,
          },
          debugging: {
            enabled: true,
            intercept: [
              {
                when: {
                  bidder: 'pubmatic',
                },
                then: {
                  cpm: 12,
                  mediaType: 'video',
                  width: SLOT_WIDTH,
                  height: SLOT_HEIGHT,
                  vastXml: SAMPLE_VAST_XML,
                },
              },
              {
                when: {
                  bidder: 'michao',
                },
                then: {
                  cpm: 10,
                  mediaType: 'video',
                  width: SLOT_WIDTH,
                  height: SLOT_HEIGHT,
                  vastXml: SAMPLE_VAST_XML,
                },
              },
            ],
          },
        });
        pbjs.addAdUnits(adUnit);
        pbjs.requestBids({
          timeout: 5000,
          bidsBackHandler: function () {
            const highestCpmBids = pbjs.getHighestCpmBids('ad-unit-1');
            if (!highestCpmBids[0]?.adId) {
              console.warn('[demo] No winning bid');
              return;
            }
            pbjs.renderAd(document, highestCpmBids[0].adId);
          },
        });
      });
    </script>
  </body>
</html>
